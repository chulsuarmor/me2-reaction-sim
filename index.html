<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반응 공정 가상 실험</title>
<script>
window.ME2_API = 'https://script.google.com/macros/s/AKfycbxnDBR2wZY_LtNBib7EuXCPA_b4OZCNpJ-S488HLQcxrMSnRuoalE-eG4hUOUuo6SoF/exec';
</script>
<style>
html { min-height: 100%; background: #f3f5f9; }
body { box-sizing: border-box; max-width: 30em; margin: 12vh auto 0; padding: 32px 36px; background: #fff; border: 1px solid #e2e7ef; border-radius: 18px; box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 16px 40px rgba(16,24,40,.10);
  color: #1b2333; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-size: 22px; line-height: 1.5; word-break: keep-all; }
h1 { font-size: 30px; margin: 0 0 12px; letter-spacing: -0.01em; }
h1::before { content: ""; display: inline-block; width: 0.6em; height: 0.6em; margin-right: 0.45em; border-radius: 6px; background: linear-gradient(135deg, #3b5bdb, #5c7cfa); vertical-align: 0.02em; }
p { margin: 0; color: #5b6576; }
@media (max-width: 600px) { body { margin: 16px; padding: 24px 20px; } }
</style>
</head>
<body>
<h1 id="h">연결 중</h1><p id="t">· 잠시 기다림</p>
<script>
(function () {
  const say = (h, t) => { document.getElementById('h').textContent = h; document.getElementById('t').textContent = '· ' + t; };
  fetch(window.ME2_API + '?api=config', { credentials: 'omit', cache: 'no-store', signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined }).then(r => r.json()).then(c => {
    const to = !c || c.ok !== true ? '' : c.mode === '본평가' ? '본평가.html' : c.mode === '연습' ? '연습.html' : '';
    if (to) location.replace(to); else say('지금은 열려 있지 않음', '선생님께 알림');
  }).catch(() => say('연결 안 됨', '새로 고침'));
})();
</script>
</body>
</html>
