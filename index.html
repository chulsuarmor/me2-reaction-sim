<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반응 공정 가상 실험</title>
<script>
window.ME2_API = 'https://script.google.com/macros/s/AKfycbxnDBR2wZY_LtNBib7EuXCPA_b4OZCNpJ-S488HLQcxrMSnRuoalE-eG4hUOUuo6SoF/exec';
</script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #f3f5f9; color: #1b2333;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-size: clamp(19px, 0.75vw + 10px, 24px); line-height: 1.3; word-break: keep-all; }
header { display: flex; align-items: center; padding: 4px 16px; border-bottom: 1px solid #e2e7ef; height: 2.6em; background: #fff; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
h1 { font-size: 1.2em; margin: 0; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
h1::before { content: ""; display: inline-block; width: 0.6em; height: 0.6em; margin-right: 0.45em; border-radius: 5px; background: linear-gradient(135deg, #3b5bdb, #5c7cfa); vertical-align: 0.02em; }
section { max-width: 34em; margin: 12vh auto 0; padding: 28px 32px; border: 1px solid #e2e7ef; border-radius: 18px; background: #fff; box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 16px 40px rgba(16,24,40,.10); }
h2 { font-size: 1.3em; margin: 0 0 10px; font-weight: 700; }
#t { font-size: max(22px, 1em); }
@media (max-height: 740px) { html, body { font-size: 18px; line-height: 1.2; } }
@media (max-width: 600px) { section { margin: 16px; padding: 24px 20px; } }
</style>
</head>
<body>
<header><h1>반응 공정 가상 실험</h1></header>
<section><h2 id="h">연결 중</h2><p id="t">· 잠시 기다림</p></section>
<script>
(function () {
  const say = (h, t) => { document.getElementById('h').textContent = h; document.getElementById('t').textContent = '· ' + t; };
  fetch(window.ME2_API + '?api=config', { credentials: 'omit', cache: 'no-store', signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined }).then(r => r.json()).then(c => {
    const to = !c || c.ok !== true ? '' : c.mode === '본평가' ? '본평가.html' : c.mode === '연습' ? '연습.html' : '';
    if (to) location.replace(to); else say('지금은 열려 있지 않음', '선생님께 알림');
  }).catch(() => say('연결 안 됨', '새로 고침'));
})();
</script>
</body>
</html>
